version: "3.9"

services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persist the database and user files outside the container
      - ./data/jobs.db:/app/backend/jobs.db
      - ./data/uploads:/app/backend/uploads
      - ./data/generated_tex:/app/backend/generated_tex
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      # certbot will write certs here
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - backend
